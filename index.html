/* ─── Intersection Observer Hook ─── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* ─── Section Wrapper ─── */
function Section({ id, children, className = '' }) {
  const [ref, inView] = useInView();
  return (
    <section id={id} ref={ref} className={`py-16 md:py-24 px-6 md:px-12 lg:px-24 ${className} ${inView ? 'slide-up' : 'opacity-0'}`}>
      {children}
    </section>
  );
}

/* ─── Navigation ─── */
function Navbar() {
  const [scrolled, setScrolled] = useState(false);

/* ─── Side Progress Nav ─── */
function SideNav() {
  const [activeSection, setActiveSection] = useState('hero');
  const [visible, setVisible] = useState(false);
  const sections = [
    { id:'hero', label:'首頁' },
    { id:'about', label:'關於春森' },
    { id:'services', label:'診療項目' },
    { id:'team', label:'醫療團隊' },
    { id:'schedule', label:'門診時間' },
    { id:'articles', label:'衛教專區' },
    { id:'news', label:'最新消息' },
    { id:'faq', label:'常見問答' },
    { id:'contact', label:'聯絡我們' },
  ];

  useEffect(() => {
    const handleScroll = () => {
      setVisible(window.scrollY > window.innerHeight * 0.5);
      const offsets = sections.map(s => {
        const el = document.getElementById(s.id);
        return el ? { id: s.id, top: Math.abs(el.getBoundingClientRect().top) } : null;
      }).filter(Boolean);
      const closest = offsets.reduce((a, b) => a.top < b.top ? a : b);
      if (closest) setActiveSection(closest.id);
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  if (!visible) return null;

  return (
    <div className="fixed right-4 top-1/2 -translate-y-1/2 z-40 hidden xl:flex flex-col items-end gap-1">
      {sections.map(s => (
        <a
          key={s.id}
          href={`#${s.id}`}
          className="group flex items-center gap-3 py-1.5"
        >
          <span className={`text-xs font-medium transition-all opacity-0 group-hover:opacity-100 ${
            activeSection === s.id ? 'opacity-100 text-forest-700' : 'text-bark-500'
          }`}>{s.label}</span>
          <span className={`block rounded-full transition-all ${
            activeSection === s.id
              ? 'w-3 h-3 bg-forest-500 shadow-md shadow-forest-200'
              : 'w-2 h-2 bg-bark-300 group-hover:bg-forest-400'
          }`}></span>
        </a>
      ))}
    </div>
  );
}
